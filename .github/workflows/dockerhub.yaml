# Publish the production image to Docker Hub after CI is green on main, then (optionally) ask Dokploy to redeploy.
# Runs after the CI workflow so the image carries the version CI's release job just wrote to version.json.
# Setup (repository → Settings → Secrets and variables → Actions), see docs/deployment.md#dokploy:
#   secrets   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN, optional DOKPLOY_DEPLOY_WEBHOOK
#   variable  DOCKERHUB_IMAGE (e.g. bubaley/hearfolio-cloud)
name: Docker Hub

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dockerhub
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push
    if: >-
      vars.DOCKERHUB_IMAGE != '' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Latest main includes the release commit (version bump) made by the CI run that triggered us.
          ref: main
          persist-credentials: false

      - name: Version
        id: ref
        run: |
          version=$(sed -n 's/.*"version"[^"]*"\([^"]*\)".*/\1/p' version.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ vars.DOCKERHUB_IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=v${{ steps.ref.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ steps.ref.outputs.version }}
            type=raw,value=sha-${{ steps.ref.outputs.short }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.version=${{ steps.ref.outputs.version }}
            org.opencontainers.image.revision=${{ steps.ref.outputs.sha }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.ref.outputs.version }}
            GIT_SHA=${{ steps.ref.outputs.sha }}
            BUILD_DATE=${{ steps.ref.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Redeploy in Dokploy
        env:
          WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
        if: env.WEBHOOK != ''
        run: curl -fsS -X POST "$WEBHOOK" -o /dev/null
